---
- name: Get all of the Guest Info
  vmware.vmware.vm_info:
    validate_certs: false
    schema: vsphere
    name: "{{ inventory_hostname }}"
  register: info
  delegate_to: localhost

- name: Firmware Check
  ansible.builtin.assert:
    that: info.vms[0].config.firmware == "efi"
    fail_msg: Boot Firmware is not EFI
  delegate_to: localhost

- name: Secure Boot Check
  ansible.builtin.assert:
    that: info.vms[0].config.bootOptions.efiSecureBootEnabled == True
    fail_msg: Secure Boot is Disabled
  delegate_to: localhost

- name: VBS Check
  ansible.builtin.assert:
    that: info.vms[0].config.flags.vbsEnabled == True
    fail_msg: VBS is Disabled
  delegate_to: localhost

- name: TPM Check
  ansible.builtin.assert:
    that: info.vms[0].summary.config.tpmPresent == False
    fail_msg: vTPM has already been added
  delegate_to: localhost

- name: Output Pre-Reqs
  ansible.builtin.debug:
    msg: "Secure Boot: {{ info.vms[0].config.bootOptions.efiSecureBootEnabled }}, Firmware:{{ info.vms[0].config.firmware }}, VBS: {{ info.vms[0].config.flags.vbsEnabled }}, TPM: {{ info.vms[0].summary.config.tpmPresent }} VMWare Tools: {{ info.vms[0].guest.toolsStatus }} VMWare Tools Running: {{ info.vms[0].guest.toolsRunningStatus }}"
  delegate_to: localhost
