---
- name: Record running services after patch
  ansible.windows.win_shell: >
    powershell -NoProfile -Command
    "Get-Service | Where-Object { $_.Status -eq 'Running' } | Select-Object -ExpandProperty Name"
  register: post_patch_services
  changed_when: false

- name: Verify critical services recovered
  ansible.builtin.assert:
    that:
      - (pre_patch_services.stdout_lines | difference(post_patch_services.stdout_lines)) | length == 0
    fail_msg: "One or more services that were running before patching did not recover."
  when: pre_patch_services.stdout_lines | length > 0
