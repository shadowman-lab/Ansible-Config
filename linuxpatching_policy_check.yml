---
- name: Patch RHEL Servers And Check OPA Group Compliance
  hosts: all

  roles:
    - shadowman_opa_group_check
    - shadowman_patching

  tasks:

    - name: Build the report
      ansible.builtin.include_role:
        name: shadowman.reports.build_report_linux_patch
        apply:
          delegate_to: report.shadowman.dev
          run_once: true
